apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  # note the name is the DB services/pods  not the Cluster name.
  name: usdf-panda-server2
  namespace: panda-db
spec:
  bootstrap:
    initdb:
      database: panda
      encoding: UTF8
      localeCType: C
      localeCollate: C
      owner: rubin
  backup:
    barmanObjectStore:
      destinationPath: s3://rubin-usdf-panda-server
      endpointURL: https://s3dfrgw.slac.stanford.edu
      s3Credentials:
        accessKeyId:
          key: ACCESS_KEY_ID
          name: s3-creds-server
        secretAccessKey:
          key: ACCESS_SECRET_KEY
          name: s3-creds-server
      wal:
        maxParallel: 8
      data:
        jobs: 8
        immediateCheckpoint: true
    retentionPolicy: 15d
    target: prefer-standby
  startDelay: 300
  instances: 2
  primaryUpdateStrategy: unsupervised

  imageName: ghcr.io/lsst-sqre/cnpg-postgres-images:17.5
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: 'true' 

  postgresql:
    shared_preload_libraries: [ 'pg_cron', 'pg_partman_bgw' ]
    parameters:
      shared_buffers: 32GB
      max_connections: "1000"
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
      work_mem: 128MB
      jit: "on"
      statement_timeout: "14400000" 
      transaction_timeout: "14400000"
      idle_in_transaction_session_timeout: "14400000"
    pg_hba:
      - local all rubin trust
      - host all rubin localhost trust
      - local all postgres trust
      - host all postgres localhost trust
      - host all all 0.0.0.0/0 md5
      - host all all ::0/0 md5
      - host all postgres 0.0.0.0/0 reject
      - host all postgres ::0/0 reject

  resources:
    requests:
      memory: 64Gi
      cpu: 8
    limits:
      memory: 192Gi
      cpu: 24

  storage:
    storageClass: wekafs--sdf-k8s01
    size: 3000Gi

  smartShutdownTimeout: 3
  startDelay: 3600
  stopDelay: 180
  switchoverDelay: 180
  failoverDelay: 180
