apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: usdf-panda-idds2
  namespace: panda-db
spec:
  #backup:
  backup:
    barmanObjectStore:
      destinationPath: s3://rubin-usdf-panda-idds
      endpointURL: https://s3dfrgw.slac.stanford.edu
      s3Credentials:
        accessKeyId:
          key: ACCESS_KEY_ID
          name: s3-creds-idds
        secretAccessKey:
          key: ACCESS_SECRET_KEY
          name: s3-creds-idds
      wal:
        maxParallel: 8
      data:
        jobs: 8
        immediateCheckpoint: true
    retentionPolicy: 15d
  
  instances: 2
  primaryUpdateStrategy: unsupervised

  imageName: ghcr.io/lsst-sqre/cnpg-postgres-images:17.5
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: 'true'

  enablePDB: true
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true

  postgresql:
    shared_preload_libraries: [ 'pg_cron', 'pg_partman_bgw' ]
    parameters:
      shared_buffers: 32GB
      max_connections: "1000"
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
      work_mem: 128MB
      jit: "off"

  resources:
    requests:
      memory: 64Gi
      cpu: 8
    limits:
      memory: 64Gi
      cpu: 8

  storage:
    storageClass: wekafs--sdf-k8s01
    size: 3000Gi
  smartShutdownTimeout: 2
  stopDelay: 180
  switchoverDelay: 178
  failoverDelay: 180
